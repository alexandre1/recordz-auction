spring:
  application:
    name: recordz

  # ── DataSource ────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/new_db_recordzv3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ── Hikari ────────────────────────────────────────────────
    hikari:
      maximum-pool-size: 20          # selon formule ci-dessus, par instance
      minimum-idle: 10
      connection-timeout: 3000       # ms — échoue vite plutôt que d'accumuler les threads bloqués
      idle-timeout: 600000           # 10 min
      max-lifetime: 1800000          # 30 min, < wait_timeout MySQL/idle timeout DB
      validation-timeout: 5000
      leak-detection-threshold: 60000 # détecte les connexions non relâchées
      pool-name: HikariPool-App
      auto-commit: false

  # ── Flyway ───────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # The original schema already exists — set baseline version to 0
    baseline-version: 0

  # ── jOOQ ─────────────────────────────────────────────────────
  jooq:
    sql-dialect: MYSQL

  # ── OAuth2 / Google ──────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, email, profile]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# ── Vaadin ───────────────────────────────────────────────────
vaadin:
  launch-browser: false

# ── Server ───────────────────────────────────────────────────
server:
  port: 8081
  servlet:
    session:
      timeout: 30m

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.example.recordz: DEBUG
    org.jooq.tools.LoggerListener: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: production
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

logging:
  level:
    root: WARN
    com.example.recordz: INFO
    org.jooq.tools.LoggerListener: WARN
    org.springframework.security: WARN